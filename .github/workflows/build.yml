name: Build BDG rec

on:
  push:
    branches: [main]

# Two pushes landing close together would otherwise run two version jobs that
# read the same version, compute the same tag, and race on the push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Bump patch version and tag
        id: bump
        run: |
          # Read version from CMakeLists.txt
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          # Check if this tag already exists
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            # Tag exists — bump patch version
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

            # Update CMakeLists.txt
            sed -i "s/VERSION ${VERSION}/VERSION ${NEW_VERSION}/" CMakeLists.txt

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add CMakeLists.txt
            git commit -m "chore: bump version to ${NEW_VERSION}"
            git push
          fi

          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

          # Create and push tag
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  build-macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          submodules: recursive

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --target BDG_REC --config Release

      # The linker only ad-hoc signs the arm64 slice automatically. macOS 26
      # (Tahoe) refuses to run code whose signature is missing or broken, so
      # sign the whole bundle explicitly — both slices — before packaging.
      - name: Ad-hoc codesign
        run: |
          APP="build/BDG_REC_artefacts/Release/BDG rec.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Generate LEIA-ME.txt
        shell: bash
        run: |
          VERSION=$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^v${VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges | grep -v "^- ci:\|^- chore:\|^- docs:" || true)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -10 | grep -v "^- ci:\|^- chore:\|^- docs:" || true)
          fi
          # Write CHANGES to temp file, then use it for substitution
          CHANGES_FILE=$(mktemp)
          echo "$CHANGES" > "$CHANGES_FILE"
          sed "s/\$VERSION/${VERSION}/g" resources/LEIA-ME.template.txt > resources/LEIA-ME.tmp
          # Replace $CHANGES line with actual changelog content
          sed -e '/\$CHANGES/{r '"$CHANGES_FILE" -e 'd;}' resources/LEIA-ME.tmp > resources/LEIA-ME.txt
          rm -f resources/LEIA-ME.tmp "$CHANGES_FILE"

      - name: Create DMG
        run: |
          mkdir -p dist
          rm -f dist/BDG_REC_macOS.dmg
          create-dmg \
            --volname "BDG rec" \
            --background "resources/fundo-instalacao.png" \
            --window-pos 200 120 \
            --window-size 600 323 \
            --icon-size 80 \
            --icon "BDG rec.app" 430 135 \
            --app-drop-link 170 135 \
            --add-file "LEIA-ME.txt" "resources/LEIA-ME.txt" 500 135 \
            --text-size 13 \
            --no-internet-enable \
            "dist/BDG_REC_macOS.dmg" \
            "build/BDG_REC_artefacts/Release/BDG rec.app"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BDG_REC_macOS
          path: dist/BDG_REC_macOS.dmg

  build-windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.version.outputs.tag }}
          submodules: recursive

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --target BDG_REC --config Release

      - name: Package
        run: |
          mkdir dist
          copy "build\BDG_REC_artefacts\Release\BDG rec.exe" "dist\BDG_REC.exe"
        shell: cmd

      - name: Upload Windows EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BDG_REC_Windows
          path: dist/BDG_REC.exe

  release:
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BDG_REC_macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: BDG_REC_Windows

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            BDG_REC_macOS.dmg
            BDG_REC.exe
          generate_release_notes: true
